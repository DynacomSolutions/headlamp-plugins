name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  generic-checks:
    runs-on: k3s-runners
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact --verbose
      - name: Generic identifier checks (no private deny-list in CI)
        run: scripts/check-identifiers.sh --all
  plugins:
    runs-on: k3s-runners
    needs: generic-checks
    strategy:
      max-parallel: 1
      matrix:
        plugin: [alerting, disk-health, github-runners, sites]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run tsc
      - run: npm run lint
      - run: npm run build
      - run: npm test
        if: matrix.plugin == 'alerting'
