name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  generic-checks:
    runs-on: k3s-runners
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact --verbose
      - name: Identifier checks (generic and private deny-list)
        env:
          DENYLIST_CONTENT: ${{ secrets.IDENTIFIERS_DENYLIST }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "${DENYLIST_CONTENT}" ]; then
            if [ "${IS_FORK_PR}" = "true" ]; then
              echo "::error::Repository secrets are unavailable to fork PRs, so the private deny-list check cannot run. A maintainer must run scripts/check-identifiers.sh --all --require-denylist locally against this branch before merging."
            else
              echo "::error::The IDENTIFIERS_DENYLIST repository secret is missing or empty. Failing closed."
            fi
            exit 1
          fi
          list="$(mktemp "${RUNNER_TEMP}/denylist.XXXXXX")"
          trap 'rm -f "${list}"' EXIT
          printf '%s\n' "${DENYLIST_CONTENT}" > "${list}"
          IDENTIFIERS_DENYLIST="${list}" scripts/check-identifiers.sh --all --require-denylist
  plugins:
    runs-on: k3s-runners
    needs: generic-checks
    strategy:
      max-parallel: 1
      matrix:
        plugin: [alerting, disk-health, github-runners, sites]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run tsc
      - run: npm run lint
      - run: npm run build
      - run: npm test
        if: matrix.plugin == 'alerting'
