name: check
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - id: detect
        shell: bash
        run: |
          event="${{ github.event_name }}"
          if [ "$event" = pull_request ]; then
            base="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
            changed="$(git diff --name-only "$base" HEAD)"
          else
            changed=''
          fi
          shared=0
          android=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.pre-commit-config.yaml|Makefile|package.json|package-lock.json|tsconfig.json|scripts/*|LICENSE) shared=1; android=1;;
              android/*) android=1;;
            esac
          done <<< "$changed"
          if [ "$event" != pull_request ]; then android=1; fi
          if [ "$android" = 1 ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi
          matrix='[]'
          if [ "$shared" = 1 ] || [ "$event" != pull_request ]; then
            matrix='["agent-resource","alerting","disk-health","github-runners","incidents","node-hardware","registry","sites","updates","uptime","usage","vm-images"]'
          else
            matrix="$(printf '%s\n' "$changed" | awk -F/ '/^plugins\/(agent-resource|alerting|disk-health|github-runners|incidents|node-hardware|registry|sites|updates|uptime|usage|vm-images)\// {print $2}' | sort -u | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '[]' ]; then has_changes=false; else has_changes=true; fi
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
  generic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Install gitleaks
        env: {GITLEAKS_VERSION: 8.30.1}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --no-banner --redact --verbose
      - name: Identifier checks
        run: scripts/check-identifiers.sh --all
  private-identifiers:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Private identifier checks
        env:
          IDENTIFIERS_DENYLIST: ${{ secrets.IDENTIFIERS_DENYLIST }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$IDENTIFIERS_DENYLIST" ]; then
            if [ "$IS_FORK_PR" = true ]; then echo "::error::Repository secrets are unavailable to fork pull requests. A maintainer must run scripts/check-identifiers.sh --all --require-denylist locally."; else echo "::error::The IDENTIFIERS_DENYLIST repository secret is missing or empty. Failing closed."; fi
            exit 1
          fi
          list="$(mktemp "${RUNNER_TEMP}/denylist.XXXXXX")"; trap 'rm -f "$list"' EXIT; printf '%s\n' "$IDENTIFIERS_DENYLIST" > "$list"
          IDENTIFIERS_DENYLIST="$list" scripts/check-identifiers.sh --all --require-denylist
  plugin:
    needs: [changes, generic-checks, private-identifiers]
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - run: npm ci
      - run: npm run tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build
  agent:
    # The agent layer (agent/): MCP server, plugin data providers, diagnosis agent. Plugin
    # providers (plugins/*/agent/) are bundled into it, so it runs on every change.
    needs: [generic-checks, private-identifiers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run tsc
      - run: npm test
      - run: npm run build
      - name: Smoke test the bundle
        # Runs dist/ copied on its own, laid out as in the image (/app/main.mjs, /app/skills),
        # so nothing can resolve through the source tree.
        run: |
          app="$(mktemp -d)"; cp -r dist/. "$app/"
          (cd "$app" && PORT=18080 KUBE_API=http://127.0.0.1:1 node main.mjs serve) & pid=$!
          for i in $(seq 1 20); do curl -fsS localhost:18080/healthz && break; sleep 0.5; done
          curl -fsS localhost:18080/ | jq -e '.tools > 15'
          kill $pid
  android:
    needs: [changes, generic-checks, private-identifiers]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ ! -d "$sdk/platforms/android-36" ] || [ ! -d "$sdk/build-tools/36.0.0" ]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
  gate:
    if: always()
    needs: [changes, generic-checks, private-identifiers, plugin, agent, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.generic-checks.result }}" = success
          test "${{ needs.private-identifiers.result }}" = success
          test "${{ needs.agent.result }}" = success
          plugin_result="${{ needs.plugin.result }}"
          if [ "${{ needs.changes.outputs.has_changes }}" = true ]; then
            test "$plugin_result" = success
          else
            test "$plugin_result" = skipped
          fi
          if [ "${{ needs.changes.outputs.android }}" = true ]; then
            test "${{ needs.android.result }}" = success
          else
            test "${{ needs.android.result }}" = skipped
          fi
