name: image

# Builds, scans and publishes one image per plugin. Nothing registry-specific
# lives in this repo; configure in Settings > Secrets and variables > Actions:
#   vars.IMAGE_REGISTRY_PREFIX  registry host and path, e.g. registry.example.com/team
#   vars.IMAGE_RUNNER_LABEL     optional runs-on label (default: ubuntu-latest)
#   secrets.REGISTRY_HOST       optional, registry host to docker login to
#   secrets.REGISTRY_USERNAME   optional, login user (skip login if unset)
#   secrets.REGISTRY_PASSWORD   optional, login password or token
# Images are named <prefix>/headlamp-<plugin>-plugin.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: "image (${{ matrix.plugin }})"
    runs-on: ${{ vars.IMAGE_RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        plugin: [disk-health, github-runners, sites]
    env:
      PLUGIN_DIR: plugins/${{ matrix.plugin }}
      IMAGE: ${{ vars.IMAGE_REGISTRY_PREFIX }}/headlamp-${{ matrix.plugin }}-plugin
    steps:
      - name: Require registry variable
        run: |
          [ -n "${{ vars.IMAGE_REGISTRY_PREFIX }}" ] || { echo "vars.IMAGE_REGISTRY_PREFIX is not set" >&2; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.PLUGIN_DIR }}/package-lock.json

      - name: Typecheck and build
        # Installs and builds the plugin's JS on the runner itself, rather
        # than inside the docker build below. The self-hosted runners' DinD
        # daemon defaults to a 1500 MTU, larger than this cluster's pod
        # network MTU, so large packets get silently dropped and `npm ci`'s
        # HTTPS fetches hang and crash when run inside `docker build`.
        # Building here and having the Dockerfile only COPY dist/ avoids
        # that network path entirely.
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          npm ci
          npm run tsc
          npm run build

      - name: Log in to registry
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -n "$REGISTRY_USERNAME" ]; then
            printf '%s' "$REGISTRY_PASSWORD" | docker login ${REGISTRY_HOST:+"$REGISTRY_HOST"} -u "$REGISTRY_USERNAME" --password-stdin
          fi

      - name: Build image
        run: |
          tag="$(git rev-parse --short=7 HEAD)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$tag" "$PLUGIN_DIR"

      - name: Scan image (HIGH/CRITICAL, fail closed)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Push image and resolve digest
        run: |
          docker push "$IMAGE:$TAG"
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in sha256:*) ;; *) echo "could not resolve digest" >&2; exit 1 ;; esac
          echo "Published \`${{ matrix.plugin }}\` tag \`$TAG\` as \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
